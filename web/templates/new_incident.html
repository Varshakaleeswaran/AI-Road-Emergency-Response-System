{% extends "base.html" %}
{% block title %}New Incident{% endblock %}
{% block page_title %}<i class="bi bi-plus-circle me-2" style="color:var(--rql-accent);"></i>New Incident{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-left">
    <h2 class="page-title">Create Incident</h2>
    <span class="page-subtitle">Manually log an accident or suspected anomaly</span>
  </div>
  <a href="{{ url_for('incidents') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left"></i> Back
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header">
        <i class="bi bi-file-earmark-plus" style="color:var(--rql-accent);"></i>
        <span class="card-title">Incident Details</span>
      </div>
      <div class="card-body">
        <form method="post">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Vehicle ID</label>
              <input type="number" class="form-control" name="vehicle_id" placeholder="e.g. 42" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Frame</label>
              <input type="number" class="form-control" name="frame" placeholder="e.g. 320" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Vehicle Type</label>
              <select class="form-select" name="vehicle_type">
                <option>Car</option>
                <option>Motorcycle</option>
                <option>Truck</option>
                <option>Bus</option>
                <option>Auto</option>
                <option>Unknown</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Severity</label>
              <select class="form-select" name="severity">
                {% for s in severities %}
                <option value="{{ s }}">{{ s }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Movement (px/s)</label>
              <input type="number" step="0.01" class="form-control" name="movement_per_sec" value="0.00" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Direction Change (°)</label>
              <input type="number" step="0.01" class="form-control" name="direction_change_angle" value="0.00" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Deceleration</label>
              <input type="number" step="0.01" class="form-control" name="deceleration" value="0.00" />
            </div>
            <div class="col-12">
              <label class="form-label">Location / Address</label>
              <input type="text" class="form-control" name="location_text"
                placeholder="e.g. NH-44, near Chennai Toll Plaza, km 42" />
            </div>
            <div class="col-12">
              <label class="form-label">Notes</label>
              <textarea class="form-control" name="notes" rows="3"
                placeholder="Initial observations or reason for creating this record…"></textarea>
            </div>
            <div class="col-12 pt-2">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Create Incident
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
