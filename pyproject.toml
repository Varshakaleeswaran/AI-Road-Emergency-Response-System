[project]
name = "resqlink-ai"
version = "0.1.0"
description = "ResQLink AI road emergency response portal"
requires-python = ">=3.10,<3.13"
dependencies = [
    "flask==3.0.3",
    "flask-socketio==5.3.6",
    "python-socketio==5.11.0",
    "bcrypt==4.1.3",
    "werkzeug==3.0.4",
    "gunicorn>=22.0,<24",
    "simple-websocket>=1.0,<2",
]

[tool.vercel]
entrypoint = "vercel_app:app"
